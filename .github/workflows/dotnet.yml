name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.101
    - name: Restore dependencies
      run: dotnet restore "Course station/Course station.sln"
    - name: Build
      run: dotnet build "Course station/Course station.sln"
    - name: Test
      run: dotnet test "Course station/Course station.sln"
